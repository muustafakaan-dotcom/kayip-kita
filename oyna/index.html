<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Kayıp Kıta — Oyna</title>
  <meta name="description" content="Kayıp Kıta'yı tarayıcıda üç rakibe karşı oyna." />
  <meta property="og:title" content="Kayıp Kıta — Tarayıcıda oyna" />
  <meta property="og:description" content="Canavar avı kart oyunu Kayıp Kıta'yı üç rakibe karşı tarayıcıda dene." />
  <meta property="og:image" content="https://muustafakaan-dotcom.github.io/kayip-kita/assets/og.jpg" />
  <meta name="theme-color" content="#0f0b08" />
  <link rel="icon" href="../assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;0,800;1,400&family=Pirata+One&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="game.css" />
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-d20" viewBox="0 0 48 48">
        <polygon class="d-face" points="24,2 43,13 43,35 24,46 5,35 5,13" />
        <polygon class="d-inner" points="24,12 37,33 11,33" />
        <path class="d-line" d="M24 2 24 12M43 13 37 33M5 13 11 33M24 46 11 33M24 46 37 33M43 35 37 33M5 35 11 33M43 13 24 12M5 13 24 12" />
      </symbol>
      <symbol id="i-sword" viewBox="0 0 24 24"><path d="M14.5 3H21v6.5L10 20.5 7.5 18 3 22l-1-1 4-4.5L3.5 14Z" /><path d="m13 11 2 2M6 13l5 5" /></symbol>
      <symbol id="i-run" viewBox="0 0 24 24"><path d="M13 4a2 2 0 1 0 4 0 2 2 0 0 0-4 0M7 22l3-6 3 2v5M5 12l3-3 5 1 3 4h4M13 10l-2 5" /></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" /></symbol>
      <symbol id="i-zoom" viewBox="0 0 24 24"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" /></symbol>
      <symbol id="i-cards" viewBox="0 0 24 24"><rect x="7" y="3" width="12" height="17" rx="2" /><path d="M5 6.5v12A2.5 2.5 0 0 0 7.5 21H15" /></symbol>
      <symbol id="i-skull" viewBox="0 0 24 24"><path d="M12 3C7.6 3 4 6.4 4 10.6c0 2.6 1.4 4.6 3 5.9V20h10v-3.5c1.6-1.3 3-3.3 3-5.9C20 6.4 16.4 3 12 3Z" /><circle cx="9" cy="11" r="1.6" /><circle cx="15" cy="11" r="1.6" /></symbol>
      <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5v-15ZM4 20.5A2.5 2.5 0 0 0 6.5 23H20v-5" /><path d="M9 8h7M9 12h5" /></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11 12 3l9 8M5 9.5V21h5v-6h4v6h5V9.5" /></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7" /></symbol>
    </defs>
  </svg>

  <div id="app">
    <!-- ============ START ============ -->
    <section id="start" class="screen start">
      <div class="start-bg" aria-hidden="true"></div>
      <div class="start-in">
        <img class="start-logo" src="../assets/logo.png" alt="Kayıp Kıta" width="132" height="127" />
        <h1>Maceracını seç</h1>
        <p class="lede">Üç rakibe karşı Büyük Üstat unvanı için yarış. Kendi diyarının canavarına karşı +1 güç kazanırsın.</p>
        <div class="heroes" id="pick" role="radiogroup" aria-label="Maceracı"></div>
        <div class="mode">
          <span class="mode-label">Oyun uzunluğu</span>
          <div class="seg" id="target" role="radiogroup">
            <button data-v="20" role="radio" aria-checked="false">Kısa<small>20. seviye</small></button>
            <button data-v="30" role="radio" aria-checked="true" class="on">Tam<small>30. seviye</small></button>
          </div>
        </div>
        <button class="btn btn-primary btn-lg" id="go" disabled>Maceracını seç</button>
        <div class="start-links">
          <button class="btn btn-outline" id="rulesLink"><span class="ic"><svg><use href="#i-book" /></svg>Nasıl oynanır?</span></button>
          <a class="btn btn-outline" href="../"><span class="ic"><svg><use href="#i-home" /></svg>Tanıtım sayfası</span></a>
        </div>
      </div>
    </section>

    <!-- ============ GAME ============ -->
    <section id="game" class="screen game" hidden>
      <div class="arena-bg" id="arenaBg" aria-hidden="true"><i></i><i></i></div>

      <header class="hud">
        <div class="hud-top">
          <button class="hud-btn" id="menuBtn" aria-label="Menü"><svg><use href="#i-menu" /></svg></button>
          <ol class="phase" id="phase" aria-label="Tur aşamaları">
            <li data-p="track">İz sür</li>
            <li data-p="decide">Karar</li>
            <li data-p="duel">Düello</li>
            <li data-p="result">Sonuç</li>
            <li data-p="rest">Dinlen</li>
          </ol>
          <button class="hud-btn hud-speed" id="speedBtn" aria-label="Oyun hızı">1x</button>
        </div>
        <div class="seats" id="seats"></div>
      </header>

      <main class="arena" id="arena">
        <div class="decks" id="decks"></div>
        <div class="stage" id="stage">
          <div class="slot slot-hab" id="slotHab"><span class="slot-ph">Habitat</span></div>
          <div class="slot slot-mon" id="slotMon"><span class="slot-ph">Canavar</span></div>
        </div>
        <div class="duel" id="duel">
          <div class="score score-mon" id="scoreMon">
            <span class="score-lbl">Canavar</span>
            <div class="score-row"><span class="die die-mon" id="dieMon"><svg><use href="#i-d20" /></svg><b></b></span><b class="score-num" id="numMon">–</b></div>
            <em class="score-note" id="noteMon"></em>
          </div>
          <div class="sab-slot" id="sabSlot" aria-label="Sabotaj"></div>
          <div class="score score-adv" id="scoreAdv">
            <div class="played" id="played"></div>
            <span class="score-lbl" id="advLbl">Maceracı</span>
            <div class="score-row"><b class="score-num" id="numAdv">–</b><span class="die die-adv" id="dieAdv"><svg><use href="#i-d20" /></svg><b></b></span></div>
            <em class="score-note" id="noteAdv"></em>
          </div>
        </div>
        <div class="banner" id="banner" hidden></div>
      </main>

      <p class="caption" id="say" aria-live="polite"></p>

      <footer class="dock">
        <div class="dock-row">
          <div class="me" id="me"></div>
          <div class="actions" id="actions"></div>
        </div>
        <div class="hand" id="hand"></div>
      </footer>

      <aside class="log" id="log" aria-label="Oyun günlüğü">
        <h2>Günlük</h2>
        <ol id="logList"></ol>
      </aside>
    </section>
  </div>

  <div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
  <div class="zoom" id="zoom" hidden><img alt="" /><p></p><small>Kapatmak için dokun</small></div>
  <div class="fx" id="fx" aria-hidden="true"></div>

  <script src="../assets/cards.js"></script>
  <script src="game.js"></script>
</body>
</html>
